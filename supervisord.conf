[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:http_server]
command=python main.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:websocket_server]
command=python websocket_server.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
